{% extends 'base.html' %}

{% block title %}Register - HostelPulse AI{% endblock %}
{% block header_title %}Create Account{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-6">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Create an Account</h2>
        <p class="text-sm text-slate-500 mt-1">Join the smart automated hostel management network</p>
    </div>

    <div class="bg-white rounded-3xl p-8 shadow-xl shadow-slate-200/60 border border-slate-200">
        <form method="POST" action="{{ url_for('auth.register') }}" class="space-y-4">
            <!-- Role Selector -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2">Register As</label>
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="student" id="role-student" onchange="toggleStudentField(true)" class="peer sr-only" {% if not role or role == 'student' %}checked{% endif %}>
                        <div class="py-2 text-center text-xs font-semibold rounded-lg text-slate-600 peer-checked:bg-white peer-checked:text-emerald-700 peer-checked:shadow-sm transition">
                            👨🎓 Student
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="role" value="warden" id="role-warden" onchange="toggleStudentField(false)" class="peer sr-only" {% if role == 'warden' %}checked{% endif %}>
                        <div class="py-2 text-center text-xs font-semibold rounded-lg text-slate-600 peer-checked:bg-white peer-checked:text-purple-700 peer-checked:shadow-sm transition">
                            👨💼 Warden
                        </div>
                    </label>
                </div>
            </div>

            <!-- Full Name -->
            <div>
                <label for="name" class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                <input 
                    type="text" 
                    name="name" 
                    id="name" 
                    value="{{ name or '' }}" 
                    required 
                    placeholder="John Doe"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
                >
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Institutional Email</label>
                <input 
                    type="email" 
                    name="email" 
                    id="email" 
                    value="{{ email or '' }}" 
                    required 
                    placeholder="student@hostel.edu"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
                >
            </div>

            <!-- Phone Number -->
            <div>
                <label for="phone" class="block text-xs font-semibold text-slate-700 mb-1">Phone Number</label>
                <input 
                    type="tel" 
                    name="phone" 
                    id="phone" 
                    value="{{ phone or '' }}" 
                    placeholder="+1 (555) 000-1234"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
                >
            </div>

            <!-- Student ID Number (Visible only for student role) -->
            <div id="student-id-container">
                <label for="student_id_num" class="block text-xs font-semibold text-slate-700 mb-1">Student Roll / ID Number</label>
                <input 
                    type="text" 
                    name="student_id_num" 
                    id="student_id_num" 
                    placeholder="STU-2024-042"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    id="password" 
                    required 
                    placeholder="Minimum 6 characters"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
                >
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password" class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
                <input 
                    type="password" 
                    name="confirm_password" 
                    id="confirm_password" 
                    required 
                    placeholder="Confirm your password"
                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500 transition"
                >
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold text-sm shadow-md shadow-emerald-600/20 transition duration-150 flex items-center justify-center gap-2 mt-6">
                <span>Create Account</span>
                <i data-lucide="user-plus" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                Already registered? 
                <a href="{{ url_for('auth.login') }}" class="font-bold text-emerald-600 hover:text-emerald-700 hover:underline">Log in here</a>
            </p>
        </div>
    </div>
</div>

<script>
    function toggleStudentField(isStudent) {
        const container = document.getElementById('student-id-container');
        if (isStudent) {
            container.classList.remove('hidden');
        } else {
            container.classList.add('hidden');
        }
    }
</script>
{% endblock %}
